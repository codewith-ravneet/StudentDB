<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AddStudent</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div id="nav-bar">
    <h1 style="color: #fca311;">🎓StudentDB</h1>
    </div>
    <form id="studentForm">
    <h2>Add Student</h2>

    <label>Student Photo</label>
    <input type="file" id="photo" accept="image/*">
        <br><br>

    <label for="studentName">Student Name:</label>
    <input type="text" id="studentname" placeholder="Enter Student Name" required>

    <br><br>
    
    <label for="fatherName">Father's Name:</label>
    <input type="text" id="fatherName" placeholder="Enter Father's Name" required>
    <br><br>

    <label for="dob">Date Of Birth:</label>
    <input type="date" id="dob" required>
    <br><br>

    <label for="Address">Address:</label>
    <textarea id="address" placeholder="Enter Address" rows="4" cols="30" required></textarea>
    <br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phoneNo" placeholder="Enter Phone Number" required>
    <br><br>


    
    <button type="submit" id="btn1">💾 Save Student</button>

</form>
<script src="student.js"></script>

</body>
</html>
